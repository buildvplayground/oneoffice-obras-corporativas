document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

width:100%;max-width:1320px;margin:0 auto;padding:0 clamp(20px,5vw,64px) clamp(56px,8vw,104px)\">\n    <div style=\"max-width:980px\">\n      <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:14px;margin-bottom:26px\">\n        <span style=\"width:38px;height:1px;background:#B4B0A6\"><\u002Fspan>\n        <span style=\"font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#CFCBC2;font-weight:500\">Obras corporativas de alto padrão<\u002Fspan>\n      <\u002Fdiv>\n      <h1 data-hero-h=\"\" data-reveal=\"\" style=\"font-weight:300;font-size:clamp(46px,7.2vw,92px);line-height:1.02;letter-spacing:-0.025em;margin:0;color:#FBFAF7;text-wrap:balance\">Ambientes corporativos à altura da sua marca.<\u002Fh1>\n      <p data-reveal=\"\" style=\"margin:28px 0 0;max-width:640px;font-size:clamp(17px,1.4vw,20px);line-height:1.62;color:#D5D1C8;font-weight:300\">Projetamos, construímos e mobiliamos escritórios de alto padrão para grandes empresas, com equipe própria, tecnologia de visualização e controle absoluto de cada detalhe, do conceito à entrega das chaves.<\u002Fp>\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;gap:14px;margin-top:38px\">\n        <a href=\"#contato\" style=\"display:inline-flex;align-items:center;gap:10px;background:#F1EFEA;color:#1C1B19;padding:16px 30px;border-radius:7px;font-weight:600;font-size:15.5px\" style-hover=\"background:#E4E0D8\">Solicite um orçamento\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"12 5 19 12 12 19\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fa>\n        <a href=\"#projetos\" style=\"display:inline-flex;align-items:center;gap:10px;background:rgba(241,239,234,0.06);color:#F1EFEA;padding:16px 30px;border-radius:7px;font-weight:500;font-size:15.5px;border:1px solid rgba(241,239,234,0.24)\" style-hover=\"background:rgba(241,239,234,0.12)\">Ver projetos<\u002Fa>\n      <\u002Fdiv>\n      <ul data-reveal=\"\" style=\"list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px 34px;margin:52px 0 0;padding:34px 0 0;border-top:1px solid rgba(241,239,234,0.18)\">\n        <li style=\"display:flex;align-items:flex-start;gap:11px;color:#D5D1C8;font-size:14.5px;line-height:1.4\"><span aria-hidden=\"true\" style=\"color:#8C887E;margin-top:1px\">·<\u002Fspan>Renders e vídeos com IA: veja o resultado antes da primeira parede<\u002Fli>\n        <li style=\"display:flex;align-items:flex-start;gap:11px;color:#D5D1C8;font-size:14.5px;line-height:1.4\"><span aria-hidden=\"true\" style=\"color:#8C887E;margin-top:1px\">·<\u002Fspan>Registros 360° a cada 10 dias para acompanhar de qualquer lugar<\u002Fli>\n        <li style=\"display:flex;align-items:flex-start;gap:11px;color:#D5D1C8;font-size:14.5px;line-height:1.4\"><span aria-hidden=\"true\" style=\"color:#8C887E;margin-top:1px\">·<\u002Fspan>+100 mil m² entregues para grandes empresas<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section aria-label=\"Nossa convicção\" style=\"background:#232220;padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px)\">\n  <div style=\"max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(32px,5vw,80px);align-items:start\">\n    <div data-reveal=\"\">\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:22px\">\n        <span style=\"width:32px;height:1px;background:#8C887E\"><\u002Fspan>\n        <span style=\"font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#B4B0A6;font-weight:500\">Fora do padrão de mercado<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"font-weight:300;font-size:clamp(30px,4vw,52px);line-height:1.08;letter-spacing:-0.02em;margin:0;color:#FBFAF7\">Cada o ,72px)\">\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:20px\">\n        <span style=\"width:32px;height:1px;background:#8C887E\"><\u002Fspan>\n        <span style=\"font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#57544D;font-weight:600\">Atuação<\u002Fspan>\n      <\u002Fdiv>\n      <h2 id=\"servicos-t\" style=\"font-weight:300;font-size:clamp(32px,4.4vw,58px);line-height:1.06;letter-spacing:-0.02em;margin:0;color:#1C1B19\">Tudo o que sua obra corporativa precisa. Em um só lugar.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px\">\n      <sc-for list=\"{{ services }}\" as=\"svc\" hint-placeholder-count=\"4\">\n        <article data-reveal=\"\" style=\"background:#F8F6F1;border:1px solid rgba(28,27,25,0.1);border-radius:14px;padding:clamp(28px,3vw,40px);display:flex;flex-direction:column;min-height:100%;transition:box-shadow .2s ease,transform .2s ease\" style-hover=\"box-shadow:0 18px 44px rgba(28,27,25,0.12);transform:translateY(-3px)\">\n          <span style=\"font-size:15px;color:#8C887E;font-weight:600;letter-spacing:.02em\">{{ svc.n }}<\u002Fspan>\n          <h3 style=\"font-size:clamp(19px,1.6vw,23px);font-weight:500;letter-spacing:-0.01em;margin:16px 0 12px;color:#1C1B19;line-height:1.2\">{{ svc.title }}<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.6;color:#5F5B53;font-weight:400\">{{ svc.desc }}<\u002Fp>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"tecnologia\" aria-labelledby=\"tec-t\" style=\"background:#1C1B19;padding:clamp(76px,9vw,136px) clamp(20px,5vw,64px)\">\n  <div style=\"max-width:1280px;margin:0 auto\">\n    <div data-reveal=\"\" style=\"max-width:760px;margin-bottom:clamp(48px,6vw,80px)\">\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:20px\">\n        <span style=\"width:32px;height:1px;background:#8C887E\"><\u002Fspan>\n        <span style=\"font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#B4B0A6;font-weight:500\">Atenção em cada detalhe<\u002Fspan>\n      <\u002Fdiv>\n      <h2 id=\"tec-t\" style=\"font-weight:300;font-size:clamp(32px,4.4vw,58px);line-height:1.06;letter-spacing:-0.02em;margin:0;color:#FBFAF7\">Veja o resultado antes de construir. Acompanhe cada passo depois.<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(28px,4.5vw,64px);align-items:center\">\n      <figure data-reveal=\"\" data-rv=\"left\" style=\"position:relative;margin:0;border-radius:18px;overflow:hidden;background:#141311;aspect-ratio:4/3;box-shadow:0 34px 80px -34px rgba(0,0,0,0.75)\">\n        <img src=\"https://lpp.oneoffice.com.br/wp-content/uploads/2026/03/002-Asper.jpg\" referrerpolicy=\"no-referrer\" alt=\"Render hiper-realista de um ambiente corporativo gerado com inteligência artificial\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover\">\n        <figcaption style=\"position:absolute;left:16px;bottom:16px;display:inline-flex;align-items:center;gap:9px;padding:9px 15px;border-radius:999px;background:rgba(20,19,17,0.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(241,239,234,0.2);font-size:11.5px;letter-spacing:.08em;color:#F1EFEA;text-transform:uppercase;font-weight:500\"><span aria-hidden=\"true\" style=\"width:6px;height:6px;border-radius:50%;background:#F1EFEA\"><\u002Fspan>Render com IA<\u002Ffigcaption>\n      <\u002Ffigure>\n      <div data-reveal=\"\" data-rv=\"right\">\n        <div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:18px\">\n          <span style=\"font-size:clamp(30px,3vw,44px);font-weight:200;color:#57544D;line-height:1;letter-spacing:-0.03em\">01<\u002Fspan>\n          <span style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8C887E;font-weight:600\">Antes da obra<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-weight:500;font-size:clamp(24px,2.6vw,34px);line-height:1.14;letter-spacing:-0.015em;margin:0 0 16px;color:#FBFAF7\">Um tour pelo seu escritório, antes da primeira parede.<\u002Fh3>\n        <p style=\"margin:0 0 14px;font-size:16.5px;line-height:1.66;color:#C4C0B7;font-weight:300\">Utilizamos inteligência artificial para criar vídeos e renders hiper-realistas do seu projeto. Você navega pelo espaço, avalia materiais, cores e layout.<\u002Fp>\n        <p style=\"margin:0;font-size:16.5px;line-height:1.66;color:#E9E6DF;font-weight:400\">Nenhuma parede sobe sem a sua aprovação.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-top:24px\">\n          <span style=\"font-size:12.5px;color:#C4C0B7;border:1px solid rgba(241,239,234,0.16);border-radius:999px;padding:7px 14px\">Materiais reais<\u002Fspan>\n          <span style=\"font-size:12.5px;color:#C4C0B7;border:1px solid rgba(241,239,234,0.16);border-radius:999px;padding:7px 14px\">Cores e layout<\u002Fspan>\n          <span style=\"font-size:12.5px;color:#C4C0B7;border:1px solid rgba(241,239,234,0.16);border-radius:999px;padding:7px 14px\">Aprovação prévia<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div aria-hidden=\"true\" style=\"height:1px;background:linear-gradient(90deg,rgba(241,239,234,0.16),rgba(241,239,234,0));margin:clamp(44px,5.5vw,80px) 0\"><\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(28px,4.5vw,64px);align-items:center\">\n      <div data-reveal=\"\" data-rv=\"left\">\n        <div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:18px\">\n          <span style=\"font-size:clamp(30px,3vw,44px);font-weight:200;color:#57544D;line-height:1;letter-spacing:-0.03em\">02<\u002Fspan>\n          <span style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8C887E;font-weight:600\">Durante a obra<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-weight:500;font-size:clamp(24px,2.6vw,34px);line-height:1.14;letter-spacing:-0.015em;margin:0 0 16px;color:#FBFAF7\">Raio-X da sua obra, do primeiro dia à entrega.<\u002Fh3>\n        <p style=\"margin:0 0 14px;font-size:16.5px;line-height:1.66;color:#C4C0B7;font-weight:300\">Capturamos fotos 360° de toda a obra e disponibilizamos em uma plataforma digital. Você navega pelo canteiro como se estivesse lá, de qualquer lugar.<\u002Fp>\n        <p style=\"margin:0;font-size:16.5px;line-height:1.66;color:#E9E6DF;font-weight:400\">Controle total, sem sair da sua mesa.<\u002Fp>\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-top:24px;padding-top:22px;border-top:1px solid rgba(241,239,234,0.12)\">\n          <span data-count=\"10\" style=\"font-size:clamp(34px,3.6vw,50px);font-weight:200;color:#FBFAF7;letter-spacing:-0.03em;line-height:1\">10<\u002Fspan>\n          <span style=\"font-size:14px;color:#A7A399;line-height:1.35;font-weight:300\">dias entre cada novo registro 360° do canteiro<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figure data-reveal=\"\" data-rv=\"right\" style=\"position:relative;margin:0;border-radius:18px;overflow:hidden;background:#141311;aspect-ratio:4/3;box-shadow:0 34px 80px -34px rgba(0,0,0,0.75)\">\n        <img src=\"https://lpp.oneoffice.com.br/wp-content/uploads/2026/03/Frame-25.jpg\" referrerpolicy=\"no-referrer\" alt=\"Registro 360° do canteiro de obras acessível pela plataforma digital\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover\">\n        <figcaption style=\"position:absolute;left:16px;bottom:16px;display:inline-flex;align-items:center;gap:9px;padding:9px 15px;border-radius:999px;background:rgba(20,19,17,0.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(241,239,234,0.2);font-size:11.5px;letter-spacing:.08em;color:#F1EFEA;text-transform:uppercase;font-weight:5 ><a href=\"#diferenciais\" style=\"color:#3D3A34;font-size:14.5px\">Diferenciais<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#57544D;font-weight:600;margin:0 0 16px\">Contato<\u002Fh3>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px\">\n          <li><a href=\"tel:+551137581151\" style=\"color:#3D3A34;font-size:14.5px\">+55 (11) 3758-1151<\u002Fa><\u002Fli>\n          <li><a href=\"mailto:contato@oneoffice.com.br\" style=\"color:#3D3A34;font-size:14.5px\">contato@oneoffice.com.br<\u002Fa><\u002Fli>\n          <li style=\"color:#5F5B53;font-size:14.5px;line-height:1.5;font-weight:300\">São Paulo, SP<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#57544D;font-weight:600;margin:0 0 16px\">Redes<\u002Fh3>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px\">\n          <li><a href=\"https://www.instagram.com/oneofficebrasil\" target=\"_blank\" rel=\"noopener\" style=\"color:#3D3A34;font-size:14.5px\">Instagram<\u002Fa><\u002Fli>\n          <li><a href=\"https://br.linkedin.com/company/one-office-arquitetura-e-engenharia\" target=\"_blank\" rel=\"noopener\" style=\"color:#3D3A34;font-size:14.5px\">LinkedIn<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding-top:24px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center\">\n      <span style=\"font-size:13px;color:#7C7768\">© 2026 One Office. Obras corporativas.<\u002Fspan>\n      <span style=\"font-size:13px;color:#7C7768\">Alto padrão, do projeto às chaves.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    const IMG = \"https://lpp.oneoffice.com.br/wp-content/uploads/2026/03/\";\n    const CL = \"https://oneoffice.com.br/wp-content/uploads/2025/04/\";\n    return {\n      toggleMenu: () => this.setMenu(true),\n      closeMenu: () => this.setMenu(false),\n      submitForm: (e) => this.submitForm(e),\n      onSkipFocus: (e) => { e.target.style.left = \"16px\"; e.target.style.top = \"12px\"; },\n      onSkipBlur: (e) => { e.target.style.left = \"-9999px\"; },\n      stats: [\n        { value: 100, suffix: \"+ mil m²\", label: \"Entregues para grandes empresas\" },\n        { value: 25, suffix: \" anos\", label: \"De experiência no setor moveleiro\" },\n        { value: 400, suffix: \" m²\", label: \"Porte mínimo das obras corporativas\" },\n        { value: 10, suffix: \" dias\", label: \"Cadência dos registros 360° da obra\" }\n      ],\n      services: [\n        { n: \"01\", title: \"Turn-Key: do projeto ao mobiliário\", desc: \"Seu escritório projetado, construído e mobiliado por um único parceiro. Você recebe um ambiente pronto para operar, com qualidade garantida de ponta a ponta.\" },\n        { n: \"02\", title: \"Execução de obras\", desc: \"Já tem o projeto definido? Assumimos a execução da sua obra corporativa com gestão digital e o mesmo padrão de controle dos projetos turn-key.\" },\n        { n: \"03\", title: \"Retrofit corporativo\", desc: \"Renove e modernize seu espaço atual. Atualizamos infraestrutura, layout e acabamentos para adequar o escritório à realidade da sua empresa.\" },\n        { n: \"04\", title: \"Readequações e expansões\", desc: \"Crescimento de equipe, mudança de layout ou novas normas. Planejamos e executamos com agilidade, minimizando o impacto na sua rotina.\" }\n      ],\n      gallery: [\n        { src: IMG + \"002-Asper.jpg\", alt: \"Recepção corporativa de alto padrão, projeto Asper\", ratio: \"3/4\" },\n        { src: IMG + \"12_NSTech.jpg\", alt: \"Área de trabalho executiva, projeto NSTech\", ratio: \"4/3\" },\n        { src: IMG + \"I0A9317.jpg\", alt: \"Ambiente corporativo com acabamento premium\", ratio: \"1/1\" },\n        { src: IMG + \"008-Asper.jpg\", alt: \"Sala de reunião com marcenaria sob medida, projeto Asper\", ratio: \"4/5\" },\n        { src: IMG + \"74_NSTech.jpg\", alt: \"Espaço de convivência corporativo, projeto NSTech\", ratio: \"3/4\" },\n        { src: IMG + \"009_Cj-1o-andar.jpg\", alt: \"Conjunto corporativo integrado, primeiro andar\", ratio: \"5/4\" },\n        { src: IMG + \"002_Cj-101-102-Ciari-Moreira.jpg\", alt: \"Escritório corporativo Ciari Moreira\", ratio: \"3/4\" },\n        { src: IMG + \"36_Conjunto-A.jpg\", alt: \"Ambiente de trabalho com iluminação planejada\", ratio: \"4/3\" }\n      ],\n      diffs: [\n        { n: \"01\", title: \"Turn-key do projeto ao mobiliário\", desc: \"Projeto arquitetônico, engenharia, execução e mobiliário corporativo integrados. Um único responsável pelo resultado final.\" },\n        { n: \"02\", title: \"25 anos no setor moveleiro\", desc: \"Empresa do grupo atuando há 25 anos na fabricação de mobiliário, com controle total de qualidade, custos e prazos.\" },\n        { n: \"03\", title: \"Assessoria desde o imóvel\", desc: \"Ajudamos a encontrar o espaço ideal para sua operação, antes mesmo do projeto começar, atendendo a todos os seus critérios.\" },\n        { n: \"04\", title: \"Gestão digital integrada\", desc: \"Plataforma centralizada com planejamento, cronograma e acompanhamento de cada etapa. Orçamento fechado, sem aditivos surpresa.\" }\n      ],\n      clients: [\n        { src: CL + \"logo-eaton-one-office-ot.png\", name: \"Eaton\" },\n        { src: CL + \"logo-danfoss-one-office-ot.png\", name: \"Danfoss\" },\n        { src: CL + \"logo-grsa-one-office-ot.png\", name: \"GRSA\" },\n        { src: CL + \"logo-nstech-one-office-ot.png\", name: \"NSTech\" },\n        { src: CL + \"logo-hedge-investments-one-office-ot.png\", name: \"Hedge Investments\" },\n        { src: \"https://oneoffice.com.br/wp-content/uploads/2025/05/logo-center-norte-one-office-ot.png\", name: \"Center Norte\" },\n        { src: CL + \"logo-oncafari-one-office-ot.jpg\", name: \"Onçafari\" },\n        { src: CL + \"logo-columbia-integracao-one-office-ot.png\", name: \"Columbia Integração\" }\n      ]\n    };\n  }\n\n  setMenu(open) {\n    const m = document.querySelector(\"[data-mobile-menu]\");\n    if (!m) return;\n    m.style.display = open ? \"flex\" : \"none\";\n    document.body.style.overflow = open ? \"hidden\" : \"\";\n  }\n\n  submitForm(e) {\n    e.preventDefault();\n    const f = e.target;\n    const g = (n) => (f.elements[n] && f.elements[n].value || \"\").trim();\n    let msg = \"Olá, gostaria de solicitar um orçamento.\";\n    const nome = g(\"nome\"), emp = g(\"empresa\"), contato = g(\"email\"), det = g(\"mensagem\");\n    if (nome) msg = \"Olá, sou \" + nome + (emp ? \" da \" + emp : \"\") + \". Gostaria de solicitar um orçamento.\";\n    if (det) msg += \" \" + det;\n    if (contato) msg += \" Meu contato: \" + contato + \".\";\n    window.open(\"https://wa.me/5511964150693?text=\" + encodeURIComponent(msg), \"_blank\");\n  }\n\n  componentDidMount() {\n    const reduce = window.matchMedia && window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n\n    // Sticky header state\n    const hd = document.querySelector(\"[data-hd]\");\n    const onScroll = () => {\n      if (!hd) return;\n      if (window.scrollY > 40) {\n        hd.style.background = \"rgba(28,27,25,0.9)\";\n        hd.style.backdropFilter = \"blur(14px)\";\n        hd.style.webkitBackdropFilter = \"blur(14px)\";\n        hd.style.borderBottomColor = \"rgba(241,239,234,0.1)\";\n      } else {\n        hd.style.background = \"transparent\";\n        hd.style.backdropFilter = \"none\";\n        hd.style.webkitBackdropFilter = \"none\";\n        hd.style.borderBottomColor = \"transparent\";\n      }\n    };\n    window.addEventListener(\"scroll\", onScroll, { passive: true });\n    onScroll();\n\n    // Reveal on scroll (progressive enhancement — directional + auto-stagger)\n    const revs = Array.from(document.querySelectorAll(\"[data-reveal]\"));\n    if (!reduce && \"IntersectionObserver\" in window) {\n      revs.forEach((el) => {\n        const dir = el.getAttribute(\"data-rv\") || \"up\";\n        let t = \"translateY(30px)\";\n        if (dir === \"left\") t = \"translateX(-36px)\";\n        else if (dir === \"right\") t = \"translateX(36px)\";\n        else if (dir === \"scale\") t = \"scale(0.96)\";\n        el.style.opacity = \"0\";\n        el.style.transform = t;\n        el.style.willChange = \"opacity, transform\";\n        el.style.transition = \"opacity .85s cubic-bezier(.2,.7,.2,1), transform .85s cubic-bezier(.2,.7,.2,1)\";\n        const sibs = el.parentElement ? Array.from(el.parentElement.children).filter((c) => c.hasAttribute(\"data-reveal\")) : [el];\n        const idx = Math.max(0, sibs.indexOf(el));\n        el.style.transitionDelay = (sibs.length > 1 ? Math.min(idx, 7) * 85 : 0) + \"ms\";\n      });\n      const io = new IntersectionObserver((entries) => {\n        entries.forEach((en) => {\n          if (en.isIntersecting) {\n            en.target.style.opacity = \"1\";\n            en.target.style.transform = \"none\";\n            io.unobserve(en.target);\n          }\n        });\n      }, { threshold: 0.12, rootMargin: \"0px 0px -8% 0px\" });\n      revs.forEach((el) => io.observe(el));\n    }\n\n    // Count-up\n    const counts = Array.from(document.querySelectorAll(\"[data-count]\"));\n    if (!reduce && \"IntersectionObserver\" in window) {\n      const cio = new IntersectionObserver((entries) => {\n        entries.forEach((en) => {\n          if (!en.isIntersecting) return;\n          const el = en.target;\n          const target = parseInt(el.getAttribute(\"data-count\"), 10) || 0;\n          const dur = 1400;\n          const t0 = performance.now();\n          const tick = (now) => {\n            const p = Math.min(1, (now - t0) / dur);\n            const eased = 1 - Math.pow(1 - p, 3);\n            el.textContent = Math.round(target * eased);\n            if (p < 1) requestAnimationFrame(tick);\n            else el.textContent = target;\n          };\n          el.textContent = \"0\";\n          requestAnimationFrame(tick);\n          cio.unobserve(el);\n        });\n      }, { threshold: 0.5 });\n      counts.forEach((el) => cio.observe(el));\n    }\n\n    // Animated curved timeline\n    this.initTimeline();\n\n    // Autoplay background videos\n    this.playVideos();\n\n    // Pause hero video for reduced motion\n    if (reduce) {\n      const v = document.querySelector(\"[data-hero-video]\");\n      if (v && v.pause) { try { v.pause(); } catch (_) {} }\n    }\n\n    window.addEventListener(\"resize\", () => {\n      if (window.innerWidth > 900) this.setMenu(false);\n    });\n  }\n\n  playVideos() {\n    const reduce = window.matchMedia && window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n    const vids = document.querySelectorAll(\"[data-hero-video],[data-body-video]\");\n    vids.forEach((v) => {\n      v.muted = true;\n      v.setAttribute(\"muted\", \"\");\n      v.loop = true;\n      v.setAttribute(\"loop\", \"\");\n      if (reduce) return;\n      try { v.load(); } catch (_) {}\n      const tryPlay = () => { const p = v.play(); if (p && p.catch) p.catch(() => {}); };\n      v.addEventListener(\"loadeddata\", tryPlay, { once: true });\n      v.addEventListener(\"canplay\", tryPlay, { once: true });\n      tryPlay();\n    });\n  }\n\n  initTimeline() {\n    const wrap = document.querySelector(\"[data-timeline]\");\n    const svg = document.querySelector(\"[data-tl-svg]\");\n    const path = document.querySelector(\"[data-tl-path]\");\n    if (!wrap || !svg || !path) return;\n    const items = Array.from(wrap.querySelectorAll(\"[data-tl-item]\"));\n    const dots = Array.from(wrap.querySelectorAll(\"[data-tl-dot]\"));\n    if (!items.length) return;\n    const reduce = window.matchMedia && window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n    const railW = 64;\n    let drawn = false;\n\n    const smooth = (pts) => {\n      if (pts.length < 2) return \"\";\n      let d = \"M \" + pts[0].x.toFixed(1) + \" \" + pts[0].y.toFixed(1);\n      for (let i = 0; i < pts.length - 1; i++) {\n        const p0 = pts[i - 1] || pts[i];\n        const p1 = pts[i];\n        const p2 = pts[i + 1];\n        const p3 = pts[i + 2] || p2;\n        const c1x = p1.x + (p2.x - p0.x) / 6;\n        const c1y = p1.y + (p2.y - p0.y) / 6;\n        const c2x = p2.x - (p3.x - p1.x) / 6;\n        const c2y = p2.y - (p3.y - p1.y) / 6;\n        d += \" C \" + c1x.toFixed(1) + \" \" + c1y.toFixed(1) + \" \" + c2x.toFixed(1) + \" \" + c2y.toFixed(1) + \" \" + p2.x.toFixed(1) + \" \" + p2.y.toFixed(1);\n      }\n      return d;\n    };\n\n    const build = () => {\n      const W = wrap.clientWidth;\n      const H = wrap.offsetHeight;\n      if (!W || !H) return;\n      svg.setAttribute(\"viewBox\", \"0 0 \" + W + \" \" + H);\n      svg.setAttribute(\"width\", W);\n      svg.setAttribute(\"height\", H);\n      const n = items.length;\n      const pts = items.map((it, i) => {\n        const cy = it.offsetTop + it.offsetHeight / 2;\n        const bow = Math.sin((n > 1 ? i / (n - 1) : 0) * Math.PI) * 22;\n        return { x: railW / 2 + bow, y: cy };\n      });\n      dots.forEach((dot, i) => { if (pts[i]) dot.style.left = pts[i].x + \"px\"; });\n      const first = pts[0], last = pts[n - 1];\n      const all = [{ x: first.x, y: Math.max(0, first.y - 44) }].concat(pts, [{ x: last.x, y: Math.min(H, last.y + 44) }]);\n      path.setAttribute(\"d\", smooth(all));\n      const len = path.getTotalLength();\n      path.style.strokeDasharray = len;\n      if (!drawn) path.style.strokeDashoffset = len;\n    };\n\n    build();\n    window.addEventListener(\"resize\", build);\n    setTimeout(build, 400);\n    setTimeout(build, 1400);\n    if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);\n\n    if (reduce) {\n      drawn = true;\n      build();\n      path.style.strokeDashoffset = 0;\n      dots.forEach((d) => { d.style.opacity = \"1\"; d.style.transform = \"translate(-50%,-50%) scale(1)\"; });\n      return;\n    }\n\n    path.style.transition = \"stroke-dashoffset 1.6s cubic-bezier(.4,0,.2,1)\";\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((en) => {\n        if (!en.isIntersecting) return;\n        drawn = true;\n        build();\n        const L = path.getTotalLength();\n        path.style.strokeDasharray = L;\n        path.style.strokeDashoffset = L;\n        requestAnimationFrame(() => requestAnimationFrame(() => { path.style.strokeDashoffset = 0; }));\n        dots.forEach((d, i) => {\n          setTimeout(() => {\n            d.style.opacity = \"1\";\n            d.style.transform = \"translate(-50%,-50%) scale(1)\";\n          }, 300 + i * 200);\n        });\n        io.disconnect();\n      });\n    }, { threshold: 0.15 });\n    io.observe(wrap);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
