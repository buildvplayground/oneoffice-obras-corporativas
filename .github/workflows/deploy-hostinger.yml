name: Deploy para Hostinger

# Publica APENAS a LP Obras 400 m² na Hostinger.
# Origem: pasta obras400n/ (index.html + favicon + fonts).
# Destino: /domains/lpp.oneoffice.com.br/public_html/obras400m/
# O docroot é um WordPress compartilhado; por isso o deploy é escopado
# só nessa subpasta e com dangerous-clean-slate: false (não apaga nada fora dela).
on:
  push:
    branches: [ main ]
    paths:
      - 'obras400n/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Sincronizar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./obras400n/
          server-dir: /domains/lpp.oneoffice.com.br/public_html/obras400m/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.claude/**
            **/.DS_Store
