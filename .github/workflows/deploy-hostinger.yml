name: Deploy para Hostinger

# Publica as LPs na Hostinger, cada uma na sua subpasta do domínio
# lpp.oneoffice.com.br. O docroot é um WordPress compartilhado; por isso
# cada passo é escopado numa subpasta e usa dangerous-clean-slate: false
# (não apaga nada fora dela).
#
#   obras400n/            -> /obras400m/            (LP Obras 400 m²)
#   obras-corporativas/   -> /obras-corporativas/   (LP Obras Corporativas — A)
#   obras-corporativas-b/ -> /obras-corporativas-b/ (LP Obras Corporativas — B)
#   arquitetos-gerenciadoras/ -> /arquitetos-gerenciadoras/ (LP Arquitetos e Gerenciadoras;
#                                _fonte/ fica de fora: é a fonte do index.html)
on:
  push:
    branches: [ main ]
    paths:
      - 'obras400n/**'
      - 'obras-corporativas/**'
      - 'obras-corporativas-b/**'
      - 'arquitetos-gerenciadoras/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Deploy — Obras 400 m² (/obras400m/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./obras400n/
          server-dir: /domains/lpp.oneoffice.com.br/public_html/obras400m/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.claude/**
            **/.DS_Store

      - name: Deploy — Obras Corporativas A (/obras-corporativas/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./obras-corporativas/
          server-dir: /domains/lpp.oneoffice.com.br/public_html/obras-corporativas/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.claude/**
            **/.DS_Store

      - name: Deploy — Obras Corporativas B (/obras-corporativas-b/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./obras-corporativas-b/
          server-dir: /domains/lpp.oneoffice.com.br/public_html/obras-corporativas-b/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.claude/**
            **/.DS_Store

      - name: Deploy — Arquitetos e Gerenciadoras (/arquitetos-gerenciadoras/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./arquitetos-gerenciadoras/
          server-dir: /domains/lpp.oneoffice.com.br/public_html/arquitetos-gerenciadoras/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.claude/**
            **/.DS_Store
            _fonte/**
            **/_fonte/**
